<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>webgl-terrain</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    #panel {
        position: fixed; left: 16px; bottom: 16px;
        padding: 8px 12px; border-radius: 8px;
        background: rgba(0, 0, 0, 0.6); color: #fff; font: 14px system-ui;
    }
    #panel input { display: block; width: 240px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="panel">
    <label for="level">수위 <output id="level-value">0.0m</output></label>
    <input id="level" type="range" min="-1" max="10" step="0.1" value="0">
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
